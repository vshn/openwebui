backup:
  enabled: false
  backend:
    existingSecret:
      name: openwebui-pipeline-secrets
      repoPasswordKey: K8UP_REPO_PASSWORD
      s3AccessKey: K8UP_ACCESS_KEY
      s3SecretKey: K8UP_SECRET_KEY
    s3:
      endpoint: ""
      bucket: ""
    promUrl: "http://platform-prometheus-pushgateway.syn-prometheus-pushgateway.svc:9091"
  schedules:
    backup: "0 1 * * *"
    check: "0 5 * * 0"
    prune: "0 3 * * 0"
    retention:
      keepLast: 7
      keepDaily: 14
  podOptions: {}

openwebui:
  enableOpenaiApi: true
  openaiApiKey: ""
  openaiBaseApiUrl: ""
  openaiBaseApiUrls:
    - "https://us-ai.corp.vshn.net/api"
  openaiApiKeysExistingSecret: openwebui-pipeline-secrets
  openaiApiKeysExistingSecretKey: OPENAI_API_KEYS
  extraEnvVars:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: openwebui-pipeline-secrets
          key: DATABASE_URL
    - name: ENABLE_OAUTH_GROUP_CREATION
      value: "True"
    - name: DEFAULT_USER_ROLE
      value: "user"
  pipelines:
    enabled: false
  ollama:
    enabled: false
  websocket:
    enabled: false
  serviceAccount:
    enable: false
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      acme.cert-manager.io/http01-edit-in-place: "true"
    tls: true
  sso:
    enabled: true
    enableSignup: true
    enableGroupManagement: true
    oidc:
      enabled: true
      clientExistingSecret: openwebui-pipeline-secrets
      clientExistingSecretKey: SSO_CLIENT_KEY
      clientIdExistingSecretKey: SSO_CLIENT_ID
      providerUrl: https://id.vshn.net/auth/realms/vshn-realm/.well-known/openid-configuration
      providerName: "VSHN IDP"
