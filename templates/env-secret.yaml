{{- $envKeys := default dict .Values.env }}
{{- $apiKey := .Values.openwebui.openaiApiKey }}
{{- $apiKeyPresent := empty $apiKey | not }}
{{- $fromEnv := $envKeys.OPENAI_API_KEYS | default "" }}
{{- if and $fromEnv $apiKeyPresent }}
{{- fail "Set the OpenAI key either via .Values.openwebui.openaiApiKey or via the OPENAI_API_KEYS env entry, not both" }}
{{- end }}
{{- $secretKey := default "openai" .Values.openwebui.openaiApiKeysExistingSecretKey }}
{{- if or $envKeys $apiKeyPresent }}
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-pipeline-secrets
  labels:
    app.kubernetes.io/name: openwebui-pipeline-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $k, $v := $envKeys }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if $apiKeyPresent }}
  {{ $secretKey }}: {{ $apiKey | quote }}
  {{- end }}
{{- end }}
